name: Build FRS Technician Prototype APK
on:
  push:
    branches: ['codex/technician-prototype-apk']
    paths: ['technician/**', '.github/workflows/technician-apk.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: actions/cache@v4
        with:
          path: ~/.android/frs-technician-demo.keystore
          key: frs-technician-demo-signing-v1
      - name: Prepare bundled prototype
        run: unzip -q technician/web-assets.zip -d technician/android/assets
      - name: Compile and sign technician APK
        run: bash technician/android/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Fire_Risk_Systems_Technician_Demo_APK
          path: |
            technician/Fire_Risk_Systems_Technician_Demo.apk
            technician/Fire_Risk_Systems_Technician_Demo.apk.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare device check dependency
        run: python3 -m pip install websocket-client==1.8.0
      - name: Install and launch on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 technician/verify_android.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FRS_Technician_Device_Checks
          path: technician/device-checks/
          if-no-files-found: ignore
