<!DOCTYPE html><html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scan equipment</title><style>body{margin:0;background:#171719;color:white;font:15px Arial}header{display:flex;justify-content:space-between;padding:22px}button{background:#E91D25;color:white;border:0;border-radius:10px;padding:13px 20px}video{width:100%;height:65vh;object-fit:cover}p{text-align:center;line-height:1.7}canvas{display:none}</style><header>Fyrebox · Scan equipment<button onclick="Scanner.close()">Close</button></header><video id="video" autoplay muted playsinline></video><canvas id="canvas"></canvas><p id="status">Keep the label steady and well lit.</p><p><button onclick="startCamera()">Restart camera</button></p><script src="jsQR.js"></script><script>let stream,running=false;const video=document.getElementById('video'),canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d',{willReadFrequently:true});function stopCamera(){running=false;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;video.srcObject=null;}async function startCamera(){stopCamera();try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280}},audio:false});video.srcObject=stream;await video.play();running=true;requestAnimationFrame(scan);}catch(e){document.getElementById('status').textContent='Camera could not start. Close and enter the equipment ID.';}}function scan(){if(!running)return;if(video.readyState>=2){const scale=Math.min(1,800/video.videoWidth);canvas.width=video.videoWidth*scale;canvas.height=video.videoHeight*scale;ctx.drawImage(video,0,0,canvas.width,canvas.height);const p=ctx.getImageData(0,0,canvas.width,canvas.height),q=jsQR(p.data,p.width,p.height);if(q){stopCamera();Scanner.found(q.data);return;}}requestAnimationFrame(scan);}startCamera();</script></html>
